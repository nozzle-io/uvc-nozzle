name: CI

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'release' }}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        run: ./build/uvc_tests --reporter compact

      - name: Build binary
        run: cmake --build build --config Release --target uvc-nozzle

      - name: Verify universal binary
        run: lipo -archs build/uvc-nozzle.app/Contents/MacOS/uvc-nozzle

      - name: Codesign
        run: codesign --force --deep --sign - build/uvc-nozzle.app

      - name: Package
        run: cd build && zip -r ../uvc-nozzle-macos-universal.zip uvc-nozzle.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uvc-nozzle-macos-universal
          path: uvc-nozzle-macos-universal.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        run: .\build\Release\uvc_tests.exe --reporter compact

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev libdrm-dev wayland-protocols libwayland-dev libxkbcommon-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        run: ./build/uvc_tests --reporter compact

  release:
    needs: [build-macos, build-windows, build-linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uvc-nozzle-macos-universal

      - name: Get release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "unsupported release ref: ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Delete old latest release
        if: steps.tag.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release delete latest --yes --repo ${{ github.repository }}
          else
            echo "No existing latest release to delete"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.tag.outputs.tag }}" == "latest" ]]; then
            gh release create latest uvc-nozzle-macos-universal.zip \
              --repo ${{ github.repository }} \
              --title "Latest development snapshot" \
              --prerelease \
              --notes "Development snapshot from main. Commit: ${{ github.sha }}"
          else
            gh release create "${{ steps.tag.outputs.tag }}" uvc-nozzle-macos-universal.zip \
              --repo ${{ github.repository }} \
              --title "${{ steps.tag.outputs.tag }}" \
              --notes "Release ${{ steps.tag.outputs.tag }}"
          fi
